<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>my snitch.</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="my snitch.">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="warn" role="alert" hidden></div>

  <section id="home" class="panel"></section>
  <section id="entry" class="panel" hidden></section>
  <section id="sleep" class="panel" hidden></section>
  <section id="connect" class="panel" hidden></section>
  <section id="history" class="panel" hidden></section>

  <div id="update-bar">Update ready. Tap to reload.</div>

  <!-- Service worker and the "update ready" bar. A plain script, so updates still
       work even if the module script below fails to load. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        function showBar() {
          var bar = document.getElementById('update-bar');
          bar.style.display = 'block';
          bar.addEventListener('click', function () {
            if (reg.waiting) reg.waiting.postMessage('skipWaiting');
          });
        }
        if (reg.waiting && navigator.serviceWorker.controller) showBar();
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          w.addEventListener('statechange', function () {
            if (w.state === 'installed' && navigator.serviceWorker.controller) showBar();
          });
        });
      });
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
